name: watchdog
# ตรวจเว็บจริงทุกชั่วโมง ถ้าข้อมูลค้างหรือแหล่งหลักล่ม workflow จะล้ม แล้ว GitHub ส่งอีเมลแจ้ง
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/watchdog.mjs
