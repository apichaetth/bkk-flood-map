name: probe-sources
on:
  push:
    branches: [main]
    paths: ['scripts/probe-sources.mjs', '.github/workflows/probe-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-sources.mjs

