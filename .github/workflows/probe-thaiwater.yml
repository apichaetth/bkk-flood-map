name: probe-thaiwater
on:
  push:
    branches: [main]
    paths: ['scripts/probe-thaiwater.mjs', '.github/workflows/probe-thaiwater.yml']
  workflow_dispatch:
    inputs:
      endpoints:
        description: 'endpoint (เว้นวรรค) ว่าง = รายการมาตรฐาน'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-thaiwater.mjs $EPS
        env:
          EPS: ${{ inputs.endpoints }}
